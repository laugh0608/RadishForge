name: M0 tagged OCI push
'on':
  push:
    tags:
      - 'm0-oci-*'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      REGISTRY: ${{ vars.M0_REGISTRY_HOST }}
      IMAGE: ${{ vars.M0_IMAGE }}
      BUILDKIT_IMAGE: ${{ vars.M0_BUILDKIT_IMAGE }}
      EXPECTED_SHA: ${{ github.sha }}
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare the source fixture
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$REGISTRY" =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$IMAGE" == "$REGISTRY/"* ]]
          [[ "$IMAGE_TAG" =~ ^m0-oci-[a-z0-9-]+$ ]]
          [[ "$BUILDKIT_IMAGE" =~ ^docker\.io/moby/buildkit@sha256:[0-9a-f]{64}$ ]]
          mkdir .m0-image
          printf 'FROM scratch\nCOPY source-sha /source-sha\n' > .m0-image/Dockerfile
          printf '%s\n' "$EXPECTED_SHA" > .m0-image/source-sha
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.M0_REGISTRY_HOST }}
          username: ${{ secrets.M0_REGISTRY_USERNAME }}
          password: ${{ secrets.M0_REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver: docker-container
          driver-opts: image=${{ vars.M0_BUILDKIT_IMAGE }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .m0-image
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ vars.M0_IMAGE }}:${{ github.ref_name }}
      - name: Record the pushed digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'source_sha=%s image=%s@%s\n' "$EXPECTED_SHA" "$IMAGE" "$IMAGE_DIGEST"
