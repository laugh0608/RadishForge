# Temporary M0 fixture inside the dedicated arm64 guest.
worker_processes 1;
error_log /var/lib/rf-gate/nginx/error.log warn;
pid /var/lib/rf-gate/nginx/nginx.pid;

events { worker_connections 64; }

http {
    log_format gate '$msec $request_method $status $upstream_status';
    access_log /var/lib/rf-gate/nginx/access.log gate;
    client_max_body_size 4k;
    client_body_temp_path /var/lib/rf-gate/nginx/body;
    proxy_temp_path /var/lib/rf-gate/nginx/proxy;
    fastcgi_temp_path /var/lib/rf-gate/nginx/fastcgi;
    uwsgi_temp_path /var/lib/rf-gate/nginx/uwsgi;
    scgi_temp_path /var/lib/rf-gate/nginx/scgi;

    server {
        listen 172.29.53.1:3000 ssl;
        server_name read.m0.test;
        ssl_certificate /var/lib/rf-gate/tls/read.crt;
        ssl_certificate_key /var/lib/rf-gate/tls/read.key;

        if ($host != read.m0.test) { return 403; }
        if ($request_uri != /m0/issue-list) { return 403; }
        if ($request_method != GET) { return 403 "rf-readgate-method-denied\n"; }

        location = /m0/issue-list {
            proxy_method GET;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host forge.m0.test:3000;
            proxy_set_header Authorization $http_authorization;
            proxy_ssl_trusted_certificate /var/lib/rf-gate/tls/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_server_name on;
            proxy_ssl_name forge.m0.test;
            proxy_next_upstream off;
            proxy_pass https://172.29.52.10:3000/api/v1/repos/owner/private-source/issues;
        }
        location / { return 403; }
    }
}
